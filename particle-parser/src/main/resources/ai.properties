# ===== AI 大模型页面解析配置 =====
# 说明：particle-parser 只依赖 matrix.ai.LargeModelClient 接口，
#      接入任意大模型只需实现该接口，并把全限定类名填到 ai.impl。
#      连接参数由框架透传给实现类读取，框架本身不直接调用模型。

# 是否启用 AI 解析
ai.enabled=true

# 大模型实现类（实现 matrix.ai.LargeModelClient），留空=使用空实现，不发起任何调用
# 示例: ai.impl=com.example.MyLlmClient
ai.impl=

# 以下为通用连接参数，供实现类按需读取
ai.provider=
ai.base_url=
ai.api_key=
ai.model=
ai.temperature=0.2
ai.max_tokens=2048
ai.timeout_ms=30000

# 送入模型的最大正文字数（超出截断，防止超上下文）
ai.max_input_chars=12000

# 该解析器注册到的 Category
ai.category=AI_PAGE_STRUCT

# 提示词模板；支持占位符 ${url} ${searchKey} ${content}
ai.prompt.system=你是网页结构化解析助手。请阅读给定页面内容并抽取关键字段，只输出一个 JSON 对象，不要输出多余解释。
ai.prompt.user=页面地址：${url}\n搜索关键：${searchKey}\n页面内容：\n${content}\n\n请输出结构化 JSON。